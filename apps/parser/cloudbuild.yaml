# Builds the parser's image on Cloud Build from the repository root, since
# the Dockerfile needs packages/core beside apps/parser:
#
#   gcloud builds submit . --config=apps/parser/cloudbuild.yaml \
#     --substitutions=_IMAGE=<region>-docker.pkg.dev/<project>/travelmo/parser
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/parser/Dockerfile, -t, "${_IMAGE}", .]
images: ["${_IMAGE}"]
# The log goes to Cloud Logging alone, which gcloud streams to a caller with
# Logs Viewer; the default logs bucket streams only to a project Viewer, and
# CI's deployer (deploy/github-deploy.sh) is not one.
options:
  logging: CLOUD_LOGGING_ONLY
