# Firebase App Hosting backend for apps/web. Set the backend's root directory
# to apps/web in the console; the monorepo's pnpm workspace is detected from
# the repository root.
# The build script bundles the service worker before `next build`.
scripts:
  buildCommand: pnpm build

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Public Firebase web config and the parser URL are build-time inputs because
# Next.js inlines NEXT_PUBLIC_* into the client bundle. Fill these in per
# environment (apphosting.<env>.yaml) or in the console.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_PARSER_URL
    value: https://REPLACE_ME.run.app
    availability: [BUILD, RUNTIME]
  # Optional: Places API (New) key, restricted to this app's origins, for
  # address autocomplete in the booking form.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  # Optional: the public half of the parser's VAPID key pair, for reminders
  # as notifications in the browser.
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  # Optional: the domain of the forwarding addresses the parser issues
  # (FORWARD_DOMAIN there); Settings offers forward-to-import when set.
  - variable: NEXT_PUBLIC_FORWARD_DOMAIN
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
