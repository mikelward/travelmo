name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A pull request's newer push cancels its older run. A push to main never
# cancels or queues behind another: each gets a group of its own, so the
# Publish job below finishes for every push, and the next push's release
# notes (its own before..after range) never cover a publication that was
# cancelled out from under the one before.
concurrency:
  group: ci-${{ github.event_name == 'push' && format('main-{0}', github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Firestore emulator behind the rules tests needs a JRE.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @travelmo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @travelmo/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
  # The Android app (apps/android): a Gradle build of its own. The commit
  # count is the app's versionCode, so the checkout is unshallow; the test
  # and lint runs fix the version so a per-commit manifest never misses the
  # build cache. The sibling Android apps' CI has the same shape.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Test the shallow-clone deepener
        working-directory: .
        run: python3 scripts/unshallow_test.py
      # The only coverage scripts/publish-github-release.sh can get: the
      # release job is main-only, so its steps never run on a pull request.
      - name: Test the release-publishing script
        working-directory: .
        run: python3 scripts/publish_github_release_test.py
      - name: Check the core module stays free of Android
        run: ./gradlew :core:verifyNoAndroid :core:test
      - name: Prove that guard actually fails
        run: |
          set +e
          output=$(GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE=true ./gradlew :core:verifyNoAndroid -PverifyNoAndroidSelfTest 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$output"
            echo "::error::verifyNoAndroid passed with an Android dependency on :core, so it proves nothing."
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'androidx.core:core-ktx'; then
            echo "$output"
            echo "::error::verifyNoAndroid failed, but without naming the injected dependency."
            exit 1
          fi
      - name: Unit tests, lint and a debug build
        run: ./gradlew -PtravelmoFixedVersion :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # The screens rendered under Robolectric against the PNGs in
      # app/snapshots: a UI change must come with its re-recorded PNGs, so the
      # diff is in the PR. The run above records nothing; this one compares.
      - name: Screenshots match the recorded ones
        run: ./gradlew -PtravelmoFixedVersion -Proborazzi.test.verify :app:testDebugUnitTest --tests app.travelmo.ui.ScreenScreenshotTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-screenshots
          path: |
            apps/android/app/build/outputs/roborazzi
            apps/android/app/snapshots
          retention-days: 7
      # The only R8 coverage: debug builds never minify. On a push to main
      # the release job builds the bundle instead, so this is for pull requests.
      - name: Release build
        if: github.event_name != 'push'
        run: ./gradlew :app:assembleRelease
  # A push to main builds the signed release bundle, keeps it as a workflow
  # artifact, publishes it as a GitHub prerelease tagged by its versionCode
  # with the release-worthy commit subjects as notes, and, once a Play
  # service account is configured, uploads it to the Play internal track
  # (README "Release"). The secrets live in the `production` environment,
  # whose deployment branches should be limited to main. Without the
  # keystore the job warns and stops rather than fails: the app has no Play
  # listing yet, and a red main for every merge would say nothing new.
  release:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One publication at a time, whatever the workflow-level groups above
    # let run side by side: two publishing at once could upload to Play out
    # of versionCode order. The group holds one pending job, so a third
    # back-to-back push evicts the second's; the notes step below measures
    # from the last published release, so nothing is lost, only deferred.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Say when nothing can be published yet
        if: env.HAS_RELEASE_KEYSTORE != 'true' || env.HAS_FIREBASE_CONFIG != 'true'
        run: |
          echo "::warning::No release: RELEASE_KEYSTORE_BASE64 (with RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) and GOOGLE_SERVICES_JSON must both be set in the production environment. See README 'Release'."
      - uses: actions/setup-java@v5
        if: env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_FIREBASE_CONFIG == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        if: env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_FIREBASE_CONFIG == 'true'
        with:
          cache-read-only: true
      - name: Materialize the release keystore and the Firebase config
        if: env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_FIREBASE_CONFIG == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is set but these companion secrets are missing or empty:$missing"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$RELEASE_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The decoded release keystore is not a keystore, or RELEASE_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          if ! jq -e '.project_info and .client' apps/android/app/google-services.json >/dev/null; then
            echo "::error::GOOGLE_SERVICES_JSON is set but is not a google-services.json (no project_info or client)."
            exit 1
          fi
      - name: Build the release bundle
        if: env.RELEASE_KEYSTORE_FILE != ''
        working-directory: apps/android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_FILE != ''
        with:
          name: app-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      # The notes are the commit subjects worth announcing since the last
      # published release: not the docs:, test:, build:, refactor: or ci:
      # ones, and not commits that touched only Markdown, dotfiles or the
      # design mockups. Nothing worth announcing means no release, and the
      # bundle stays as the artifact.
      #
      # The range starts at the newest published tag, not at this push's
      # `before`: the job-level group above holds one pending job, so a
      # third back-to-back push evicts the second's, and a push whose own
      # commits were all housekeeping publishes nothing. Either way those
      # commits are still unannounced, and measuring from the last
      # publication carries them into the next release instead of losing
      # them. The tags come with the full-depth checkout; the first release
      # ever, with no tag yet, falls back to the push's own range. A tag on
      # this very commit is this run's own earlier attempt (the GitHub
      # release went up, the Play upload did not), so it is skipped over:
      # the rerun then rebuilds the same notes, the script finds its release
      # already there, and the upload gets its second chance.
      - name: Build release notes
        if: env.RELEASE_KEYSTORE_FILE != ''
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$(git rev-parse "$tag^{commit}")" = "$AFTER_SHA" ] && continue
            if git merge-base --is-ancestor "$tag" "$AFTER_SHA"; then
              base="$tag"
              echo "Release notes start after the last published release, $tag."
              break
            fi
          done < <(git tag --list 'v[0-9]*' --sort=-v:refname)
          if [ -n "$base" ]; then
            :
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git rev-parse --quiet --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            base="$BEFORE_SHA"
            echo "No published release behind this commit; release notes cover this push."
          fi
          if [ -n "$base" ]; then
            shas=$(git log --reverse --no-merges --format=%H "$base..$AFTER_SHA")
          else
            shas=$(git log -1 --format=%H "$AFTER_SHA")
          fi
          notes=""
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              ci:*|docs:*|test:*|tests:*|build:*|refactor:*|internal:*) continue ;;
            esac
            relevant=false
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                .*|*.md|design/*) ;;
                *) relevant=true; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$sha")
            [ "$relevant" = true ] || continue
            line="• $subject"
            if [ -z "$notes" ]; then notes="$line"; else notes="$notes"$'\n'"$line"; fi
          done <<< "$shas"
          if [ -z "$notes" ]; then
            echo "Nothing release-worthy in this push; the bundle is kept as the artifact only."
            echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Play's "What's new" takes 500 characters per language.
          notes=$(printf '%s' "$notes" | python3 -c 'import sys; t = sys.stdin.read(); print(t if len(t) <= 500 else t[:497] + "…")')
          delim="RELEASE_NOTES_EOF_$(openssl rand -hex 16)"
          { printf 'RELEASE_NOTES<<%s\n' "$delim"; printf '%s\n' "$notes"; printf '%s\n' "$delim"; } >> "$GITHUB_ENV"
      - name: Publish a GitHub release
        if: env.RELEASE_KEYSTORE_FILE != '' && env.RELEASE_NOTES_SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          AAB_PATH: apps/android/app/build/outputs/bundle/release/app-release.aab
          ASSET_BASE: travelmo
        run: scripts/publish-github-release.sh
      - name: Compose the Play "What's new"
        if: env.RELEASE_KEYSTORE_FILE != '' && env.HAS_PLAY_SA == 'true' && env.RELEASE_NOTES_SKIP != 'true' && env.RELEASE_SUPERSEDED != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          echo "PLAY_WHATSNEW_DIR=$RUNNER_TEMP/whatsnew" >> "$GITHUB_ENV"
      - name: Upload to Play Store internal track
        if: env.RELEASE_KEYSTORE_FILE != '' && env.HAS_PLAY_SA == 'true' && env.RELEASE_NOTES_SKIP != 'true' && env.RELEASE_SUPERSEDED != 'true'
        uses: r0adkll/upload-google-play@a80b0bcdcfdfcc2d026f2bc73f726760b2cbc967 # post-v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.travelmo
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ env.PLAY_WHATSNEW_DIR }}
